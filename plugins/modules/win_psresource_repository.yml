DOCUMENTATION:
  module: win_psresource_repository
  short_description: Add, update, or remove a PSResourceGet repository
  description:
    - Registers, updates, or unregisters a repository used by C(Microsoft.PowerShell.PSResourceGet).
    - This module is the PSResourceGet equivalent of C(community.windows.win_psrepository),
      which only works with PowerShellGet v2.
    - Repositories are registered per user, so the module changes the repositories of the
      account it runs as. Use C(become) to manage the repositories of another user.
  version_added: 3.10.0
  options:
    name:
      description:
        - The name of the repository to manage.
        - Wildcard characters are not supported.
      type: str
      required: true
    uri:
      description:
        - The location used to find and install resources from this repository.
        - This can be a NuGet v2 or v3 feed URL, a container registry, or a local or UNC path.
        - Required when registering a new repository, except for V(PSGallery).
        - If O(name=PSGallery) and the repository is not registered, omitting O(uri) registers the default PSGallery.
        - When updating an existing repository, only the options that are set are changed.
      type: str
      aliases:
        - source_location
    state:
      description:
        - If V(present), the repository is registered or updated.
        - If V(absent), the repository is unregistered.
      type: str
      choices: [absent, present]
      default: present
    trusted:
      description:
        - Whether the repository is trusted.
        - Installing from an untrusted repository requires O(ansible.windows.win_psresource#module:trust_repository=true)
          because the confirmation prompt cannot be answered interactively.
        - New repositories are untrusted if this is not set.
      type: bool
    priority:
      description:
        - The priority of the repository, from V(0) to V(100).
        - A lower number means the repository is searched first.
        - New repositories use V(50) if this is not set.
      type: int
    api_version:
      description:
        - The API version of the repository.
        - If not set when registering, PSResourceGet detects it from O(uri).
      type: str
      choices: [v2, v3, local, nugetServer, containerRegistry]
    credential_info:
      description:
        - The SecretManagement vault and secret used to authenticate with the repository.
        - The secret itself is stored in the vault, not in the repository registration.
        - The C(Microsoft.PowerShell.SecretManagement) module and a registered vault are needed
          to use the credential. The task fails if the module is not installed.
      type: dict
      suboptions:
        vault_name:
          description: The name of the SecretManagement vault.
          type: str
          required: true
        secret_name:
          description: The name of the secret in the vault.
          type: str
          required: true
  requirements:
    - Microsoft.PowerShell.PSResourceGet 1.0.0 or newer
  notes:
    - Removing a repository that is not registered, or setting options to the values they already have, does not report a change.
    - PSResourceGet may normalise O(uri), for example by following a redirect. The module compares the parsed URI
      with the registered one, so use the value returned by M(ansible.windows.win_psresource_repository_info)
      if the task reports a change on every run.
  extends_documentation_fragment:
    - ansible.builtin.action_common_attributes
  attributes:
    check_mode:
      support: full
    diff_mode:
      support: full
    platform:
      platforms:
        - windows
  seealso:
    - module: ansible.windows.win_psresource_repository_info
    - module: ansible.windows.win_psresource
    - module: ansible.windows.win_psresource_info
  author:
    - Mathieu Fortin (@mfortin)

EXAMPLES: |
  - name: Register the default PSGallery repository
    ansible.windows.win_psresource_repository:
      name: PSGallery

  - name: Register an internal NuGet v3 repository and trust it
    ansible.windows.win_psresource_repository:
      name: MyRepository
      uri: https://nuget.example.com/v3/index.json
      trusted: true
      priority: 10

  - name: Trust the PSGallery repository
    ansible.windows.win_psresource_repository:
      name: PSGallery
      trusted: true

  - name: Register a local folder as a repository
    ansible.windows.win_psresource_repository:
      name: LocalRepo
      uri: C:\Repos\PowerShell
      trusted: true

  - name: Register a repository that authenticates with a SecretManagement secret
    ansible.windows.win_psresource_repository:
      name: PrivateRepo
      uri: https://nuget.example.com/private/v3/index.json
      credential_info:
        vault_name: MyVault
        secret_name: PrivateRepoSecret

  - name: Unregister a repository
    ansible.windows.win_psresource_repository:
      name: MyRepository
      state: absent

RETURN: {}
