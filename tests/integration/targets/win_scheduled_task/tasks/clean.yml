# cleans up each test to ensure a blank slate
---
- name: Clean up scheduled tasks
  ansible.windows.win_scheduled_task:
    name: '{{ item.name }}'
    path: '{{ item.path | default(omit) }}'
    state: absent
  loop:
    - name: Task # old tests
      path: \Path
    - name: '{{ test_scheduled_task_name }}'
      path: \
    - name: '{{ test_scheduled_task_name }}'
      path: '{{ test_scheduled_task_path }}'
    - name: '{{ test_scheduled_task_name }} with system user'
      path: '{{ test_scheduled_task_path }}'

- name: Clean up test user account
  ansible.windows.win_user:
    name: '{{ test_scheduled_task_user }}'
    state: absent
