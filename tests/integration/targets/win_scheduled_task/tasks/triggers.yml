      - create_trigger_repetition_result_check.triggers[0].repetition.interval is none
      - create_trigger_repetition_result_check.triggers[0].repetition.duration is none
      - create_trigger_repetition_result_check.triggers[0].repetition.stop_at_duration_end == false

