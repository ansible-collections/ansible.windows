---
- name: Fail to install without inf_file
  ansible.windows.win_inf_printer_driver:
    driver_name: "{{ test_inf_printer_builtin_name }}"
    state: present
  register: no_inf
  failed_when: "no_inf.msg != 'state is present but all of the following are missing: inf_file'"

- name: Fail to install from a missing INF file
  ansible.windows.win_inf_printer_driver:
    driver_name: Ansible Undefined Driver
    inf_file: '{{ remote_tmp_dir }}\missing.inf'
    state: present
  register: missing_inf
  failed_when: "'Cannot find or access the driver INF file' not in missing_inf.msg"

- name: Fail to install a driver that is not defined in the INF file
  ansible.windows.win_inf_printer_driver:
    driver_name: Ansible Undefined Driver
    inf_file: "{{ test_inf_printer_builtin_inf }}"
    state: present
  register: invalid_inf
  failed_when: "'Error installing printer driver' not in invalid_inf.msg"

- name: Test that a failed driver query is not reported as an absent driver
  block:
    - name: Stop the print spooler and record its running dependent services
      ansible.windows.win_powershell:
        script: |
          $spooler = Get-Service -Name Spooler
          $Ansible.Result = @($spooler.DependentServices | Where-Object Status -eq Running | ForEach-Object Name)
          Stop-Service -InputObject $spooler -Force -ErrorAction Stop
      register: spooler_stop

    - name: Remove a driver while the print spooler is stopped
      ansible.windows.win_inf_printer_driver:
        driver_name: "{{ test_inf_printer_builtin_name }}"
        state: absent
      register: spooler_stopped
      failed_when: "'Failed to query printer drivers' not in spooler_stopped.msg"

  always:
    - name: Start the print spooler and its previously running dependent services
      ansible.windows.win_service:
        name: "{{ item }}"
        state: started
      loop: "{{ ['Spooler'] + spooler_stop.result }}"

- name: Run the built-in driver lifecycle
  module_defaults:
    ansible.windows.win_inf_printer_driver:
      driver_name: "{{ test_inf_printer_builtin_name }}"
      inf_file: "{{ test_inf_printer_builtin_inf }}"
  vars:
    builtin_driver: "{{ test_inf_printer_builtin_name }} (Windows x64)"
  block:
    - name: Ensure the built-in driver is absent before the tests
      ansible.windows.win_inf_printer_driver:
        state: absent

    - name: Install the driver in check mode
      ansible.windows.win_inf_printer_driver:
        state: present
      check_mode: true
      register: install_check

    - name: Get the state after the check-mode install
      ansible.windows.win_powershell: &get_state
        parameters:
          Name: "{{ test_inf_printer_builtin_name }}"
        script: |
          param($Name)
          $Ansible.Changed = $false
          $drivers = Get-PrinterDriver -ErrorAction Stop | Where-Object Name -eq $Name
          $Ansible.Result = @{
              drivers = @($drivers | ForEach-Object { "$($_.Name) ($($_.PrinterEnvironment))" } | Sort-Object)
          }
      register: state

    - name: Assert the check-mode install installed nothing
      ansible.builtin.assert:
        that:
          - install_check is changed
          - state.result.drivers == []

    - name: Install the driver
      ansible.windows.win_inf_printer_driver:
        state: present
      diff: true
      register: install

    - name: Install the driver again
      ansible.windows.win_inf_printer_driver:
        state: present
      register: install_again

    - name: Get the state after install
      ansible.windows.win_powershell: *get_state
      register: state

    - name: Assert the driver was installed once
      ansible.builtin.assert:
        that:
          - install is changed
          - install.diff.before == ''
          - install.diff.after == builtin_driver ~ '\n'
          - install_again is not changed
          - state.result.drivers == [builtin_driver]

    - name: Remove a driver using a wildcard pattern as the name
      ansible.windows.win_inf_printer_driver:
        driver_name: Generic*
        state: absent
      register: remove_wildcard

    - name: Remove the driver in check mode
      ansible.windows.win_inf_printer_driver:
        state: absent
      check_mode: true
      register: remove_check

    - name: Get the state after the wildcard and check-mode removals
      ansible.windows.win_powershell: *get_state
      register: state

    - name: Assert the wildcard and check-mode removals removed nothing
      ansible.builtin.assert:
        that:
          - remove_wildcard is not changed
          - remove_check is changed
          - state.result.drivers == [builtin_driver]

    - name: Remove the driver
      ansible.windows.win_inf_printer_driver:
        state: absent
      diff: true
      register: remove

    - name: Remove the driver again
      ansible.windows.win_inf_printer_driver:
        state: absent
      register: remove_again

    - name: Get the state after remove
      ansible.windows.win_powershell: *get_state
      register: state

    - name: Assert the driver was removed once
      ansible.builtin.assert:
        that:
          - remove is changed
          - remove.diff.before == builtin_driver ~ '\n'
          - remove.diff.after == ''
          - remove_again is not changed
          - state.result.drivers == []

  always:
    - name: Remove the built-in driver
      ansible.windows.win_inf_printer_driver:
        state: absent
      register: cleanup
      ignore_errors: true

    - name: Get the state after cleanup
      ansible.windows.win_powershell: *get_state
      register: state

    - name: Assert the built-in driver was cleaned up
      ansible.builtin.assert:
        that:
          - cleanup is not failed
          - state.result.drivers == []
        fail_msg: >-
          Cleanup errors: {{ [cleanup] | select('failed') | map(attribute='msg') | list }}.
          Remaining drivers: {{ state.result.drivers }}.
