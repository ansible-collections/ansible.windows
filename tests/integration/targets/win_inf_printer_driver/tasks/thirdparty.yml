---
- name: Run the third-party driver-store tests
  vars:
    driver_dir: '{{ remote_tmp_dir }}\win_inf_printer_driver'
    x64_inf: '{{ driver_dir }}\x64\{{ test_inf_printer_thirdparty_inf }}'
    x86_inf: '{{ driver_dir }}\x86\{{ test_inf_printer_thirdparty_inf }}'
    series_ii: "{{ test_inf_printer_thirdparty_names[0] }}"
    series_ii_x64: "{{ series_ii }} (Windows x64)"
    series_ii_x86: "{{ series_ii }} (Windows NT x86)"
    color_4500_x64: "{{ test_inf_printer_thirdparty_names[1] }} (Windows x64)"
    thirdparty_drivers: "{{ test_inf_printer_thirdparty_packages.keys() | product(test_inf_printer_thirdparty_names) | list }}"
  block:
    - name: Download the third-party driver packages
      ansible.windows.win_get_url:
        url: "{{ item.value.url }}"
        dest: '{{ remote_tmp_dir }}\{{ item.key }}.cab'
        checksum: "{{ item.value.checksum }}"
        checksum_algorithm: sha256
      loop: "{{ test_inf_printer_thirdparty_packages | dict2items }}"
      register: download
      until: download is successful
      retries: 3
      delay: 5

    - name: Extract the third-party driver packages
      ansible.windows.win_powershell:
        parameters:
          Source: "{{ remote_tmp_dir }}"
          Destination: "{{ driver_dir }}"
          Architectures: "{{ test_inf_printer_thirdparty_packages.keys() | list }}"
        script: |
          param($Source, $Destination, $Architectures)
          foreach ($arch in $Architectures) {
              $null = New-Item -Path "$Destination\$arch" -ItemType Directory -Force
              $output = expand.exe -F:* "$Source\$arch.cab" "$Destination\$arch"
              if ($LASTEXITCODE) {
                  throw "expand.exe failed to extract $arch.cab ($LASTEXITCODE): $output"
              }
          }

    - name: Ensure the third-party drivers and packages are absent before the tests
      ansible.windows.win_inf_printer_driver: &remove_thirdparty
        driver_name: "{{ item[1] }}"
        printer_env: "{{ item[0] }}"
        state: absent
        remove_from_driver_store: true
        remove_all: true
      loop: "{{ thirdparty_drivers }}"

    - name: Install both x64 drivers in check mode
      ansible.windows.win_inf_printer_driver:
        inf_file: "{{ x64_inf }}"
        driver_name: "{{ item }}"
      loop: "{{ test_inf_printer_thirdparty_names }}"
      check_mode: true
      register: install_check

    - name: Get the state after the check-mode install
      ansible.windows.win_powershell: &get_state
        parameters:
          Names: "{{ test_inf_printer_thirdparty_names }}"
          InfName: "{{ test_inf_printer_thirdparty_inf }}"
          Version: "{{ test_inf_printer_thirdparty_version }}"
        script: |
          param($Names, $InfName, $Version)
          $Ansible.Changed = $false
          $drivers = Get-PrinterDriver -ErrorAction Stop | Where-Object Name -in $Names
          $packages = Get-WindowsDriver -Online -ErrorAction Stop |
              Where-Object { (Split-Path $_.OriginalFileName -Leaf) -eq $InfName -and $_.Version -eq $Version }
          $Ansible.Result = @{
              drivers = @($drivers | ForEach-Object { "$($_.Name) ($($_.PrinterEnvironment))" } | Sort-Object)
              # Driver store folders are named <inf>_<architecture>_<hash>.
              packages = @($packages | ForEach-Object { (Split-Path (Split-Path $_.OriginalFileName) -Leaf).Split('_')[1] } | Sort-Object)
          }
      register: state

    - name: Assert the check-mode install installed nothing
      ansible.builtin.assert:
        that:
          - install_check is changed
          - state.result.drivers == []
          - state.result.packages == []

    - name: Install both x64 drivers from the shared INF
      ansible.windows.win_inf_printer_driver:
        inf_file: "{{ x64_inf }}"
        driver_name: "{{ item }}"
      loop: "{{ test_inf_printer_thirdparty_names }}"
      register: install

    - name: Install both x64 drivers again
      ansible.windows.win_inf_printer_driver:
        inf_file: "{{ x64_inf }}"
        driver_name: "{{ item }}"
      loop: "{{ test_inf_printer_thirdparty_names }}"
      register: install_again

    - name: Get the state after install
      ansible.windows.win_powershell: *get_state
      register: state

    - name: Assert both drivers were installed once from one package
      ansible.builtin.assert:
        that:
          - install is changed
          - install_again is not changed
          - state.result.drivers == [color_4500_x64, series_ii_x64]
          - state.result.packages == ['amd64']

    - name: Install the x86 driver with the same name
      ansible.windows.win_inf_printer_driver:
        inf_file: "{{ x86_inf }}"
        driver_name: "{{ series_ii }}"
        printer_env: x86
      register: install_x86

    - name: Unregister the x64 driver without removing the package
      ansible.windows.win_inf_printer_driver:
        driver_name: "{{ series_ii }}"
        state: absent
      register: unregister

    - name: Get the state after unregistering
      ansible.windows.win_powershell: *get_state
      register: state

    - name: Assert only the x64 driver was unregistered and both packages were kept
      ansible.builtin.assert:
        that:
          - install_x86 is changed
          - unregister is changed
          - state.result.drivers == [color_4500_x64, series_ii_x86]
          - state.result.packages == ['amd64', 'x86']

    - name: Register the x64 driver again
      ansible.windows.win_inf_printer_driver:
        inf_file: "{{ x64_inf }}"
        driver_name: "{{ series_ii }}"

    - name: Fail to purge the shared x64 package without remove_all
      ansible.windows.win_inf_printer_driver:
        driver_name: "{{ series_ii }}"
        state: absent
        remove_from_driver_store: true
      register: reject
      failed_when: "'Set remove_all=true' not in reject.msg"

    - name: Purge the shared x64 package in check mode
      ansible.windows.win_inf_printer_driver:
        driver_name: "{{ series_ii }}"
        state: absent
        remove_from_driver_store: true
        remove_all: true
      check_mode: true
      register: purge_check

    - name: Get the state after the rejected and check-mode purges
      ansible.windows.win_powershell: *get_state
      register: state

    - name: Assert the rejected and check-mode purges removed nothing
      ansible.builtin.assert:
        that:
          - purge_check is changed
          - state.result.drivers == [color_4500_x64, series_ii_x86, series_ii_x64]
          - state.result.packages == ['amd64', 'x86']

    - name: Purge the shared x64 package
      ansible.windows.win_inf_printer_driver:
        driver_name: "{{ series_ii }}"
        state: absent
        remove_from_driver_store: true
        remove_all: true
      register: purge

    - name: Get the state after the purge
      ansible.windows.win_powershell: *get_state
      register: state

    - name: Assert only the x64 drivers and package were removed
      ansible.builtin.assert:
        that:
          - purge is changed
          - state.result.drivers == [series_ii_x86]
          - state.result.packages == ['x86']

  always:
    - name: Remove the third-party drivers and packages
      ansible.windows.win_inf_printer_driver: *remove_thirdparty
      loop: "{{ thirdparty_drivers }}"

    - name: Get the state after cleanup
      ansible.windows.win_powershell: *get_state
      register: state

    - name: Assert the third-party drivers and packages were cleaned up
      ansible.builtin.assert:
        that:
          - state.result.drivers == []
          - state.result.packages == []
