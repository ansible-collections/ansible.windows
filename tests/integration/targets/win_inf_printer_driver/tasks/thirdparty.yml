---
- name: Run the third-party driver-store tests
  vars:
    driver_dir: '{{ remote_tmp_dir }}\win_inf_printer_driver'
    series_ii: "{{ test_inf_printer_thirdparty_names[0] }}"
  block:
    - name: Download the third-party driver packages
      ansible.windows.win_get_url:
        url: "{{ item.value.url }}"
        dest: '{{ remote_tmp_dir }}\{{ item.key }}.cab'
        checksum: "{{ item.value.checksum }}"
        checksum_algorithm: sha256
      loop: "{{ test_inf_printer_thirdparty_packages | dict2items }}"
      register: download
      until: download is successful
      retries: 3
      delay: 5

    - name: Extract the third-party driver packages
      ansible.windows.win_powershell:
        script: |
          foreach ($arch in 'x64', 'x86') {
              $null = New-Item -Path "{{ driver_dir }}\$arch" -ItemType Directory -Force
              $null = expand.exe -F:* "{{ remote_tmp_dir }}\$arch.cab" "{{ driver_dir }}\$arch"
          }

    - name: Get the state before the tests
      ansible.windows.win_powershell: &get_state
        parameters:
          Names: "{{ test_inf_printer_thirdparty_names }}"
          InfName: "{{ test_inf_printer_thirdparty_inf }}"
          Exclude: "{{ preexisting_packages | default([]) }}"
        script: |
          param($Names, $InfName, $Exclude)
          $Ansible.Changed = $false
          $drivers = Get-PrinterDriver | Where-Object Name -in $Names
          $packages = Get-WindowsDriver -Online | Where-Object { (Split-Path $_.OriginalFileName -Leaf) -eq $InfName } |
              ForEach-Object { Split-Path (Split-Path $_.OriginalFileName) -Leaf } |
              Where-Object { $_ -notin $Exclude }
          $Ansible.Result = @{
              drivers = @($drivers | ForEach-Object { "$($_.Name) ($($_.PrinterEnvironment))" } | Sort-Object)
              packages = @($packages)
          }
      register: state

    # Windows images ship a legacy copy of this INF as a third-party package, which must be left alone.
    - name: Record the packages that existed before the tests
      ansible.builtin.set_fact:
        preexisting_packages: "{{ state.result.packages }}"

    - name: Install both x64 drivers in check mode
      ansible.windows.win_inf_printer_driver:
        inf_file: '{{ driver_dir }}\x64\{{ test_inf_printer_thirdparty_inf }}'
        driver_name: "{{ item }}"
      loop: "{{ test_inf_printer_thirdparty_names }}"
      check_mode: true
      register: install_check

    - name: Get the state after the check-mode install
      ansible.windows.win_powershell: *get_state
      register: state

    - name: Assert the check-mode install installed nothing
      ansible.builtin.assert:
        that:
          - install_check is changed
          - state.result.drivers == []
          - state.result.packages == []

    - name: Install both x64 drivers from the shared INF
      ansible.windows.win_inf_printer_driver:
        inf_file: '{{ driver_dir }}\x64\{{ test_inf_printer_thirdparty_inf }}'
        driver_name: "{{ item }}"
      loop: "{{ test_inf_printer_thirdparty_names }}"
      register: install

    - name: Install both x64 drivers again
      ansible.windows.win_inf_printer_driver:
        inf_file: '{{ driver_dir }}\x64\{{ test_inf_printer_thirdparty_inf }}'
        driver_name: "{{ item }}"
      loop: "{{ test_inf_printer_thirdparty_names }}"
      register: install_again

    - name: Get the state after install
      ansible.windows.win_powershell: *get_state
      register: state

    - name: Assert both drivers were installed from one package
      ansible.builtin.assert:
        that:
          - install is changed
          - install_again is not changed
          - state.result.drivers | length == 2
          - state.result.packages | length == 1

    - name: Unregister one driver without removing the package
      ansible.windows.win_inf_printer_driver:
        driver_name: "{{ series_ii }}"
        state: absent
      register: unregister

    - name: Get the state after unregistering
      ansible.windows.win_powershell: *get_state
      register: state

    - name: Assert the package was kept
      ansible.builtin.assert:
        that:
          - unregister is changed
          - state.result.drivers | length == 1
          - state.result.packages | length == 1

    - name: Install the x64 and x86 drivers with the same name
      ansible.windows.win_inf_printer_driver:
        inf_file: '{{ driver_dir }}\{{ item }}\{{ test_inf_printer_thirdparty_inf }}'
        driver_name: "{{ series_ii }}"
        printer_env: "{{ item }}"
      loop:
        - x64
        - x86

    - name: Get the state before the purge
      ansible.windows.win_powershell: *get_state
      register: state_before_purge

    - name: Fail to purge the shared x64 package without remove_all
      ansible.windows.win_inf_printer_driver:
        driver_name: "{{ series_ii }}"
        state: absent
        remove_from_driver_store: true
      register: reject
      failed_when: "'Set remove_all=true' not in reject.msg | default('')"

    - name: Purge the shared x64 package in check mode
      ansible.windows.win_inf_printer_driver:
        driver_name: "{{ series_ii }}"
        state: absent
        remove_from_driver_store: true
        remove_all: true
      check_mode: true
      register: purge_check

    - name: Get the state after the rejected and check-mode purges
      ansible.windows.win_powershell: *get_state
      register: state

    - name: Assert nothing was removed
      ansible.builtin.assert:
        that:
          - purge_check is changed
          - state.result == state_before_purge.result
          - state.result.drivers | length == 3
          - state.result.packages | length == 2

    - name: Purge the shared x64 package
      ansible.windows.win_inf_printer_driver:
        driver_name: "{{ series_ii }}"
        state: absent
        remove_from_driver_store: true
        remove_all: true
      register: purge

    - name: Get the state after the purge
      ansible.windows.win_powershell: *get_state
      register: state

    - name: Assert only the x64 drivers and package were removed
      ansible.builtin.assert:
        that:
          - purge is changed
          - state.result.drivers == [series_ii ~ ' (Windows NT x86)']
          - state.result.packages | length == 1
          - "'_x86_' in state.result.packages[0]"

  always:
    - name: Remove the third-party drivers and packages
      ansible.windows.win_inf_printer_driver:
        driver_name: "{{ item[1] }}"
        printer_env: "{{ item[0] }}"
        state: absent
        remove_from_driver_store: true
        remove_all: true
      loop: "{{ ['x64', 'x86'] | product(test_inf_printer_thirdparty_names) | list }}"

    - name: Get the state after cleanup
      ansible.windows.win_powershell: *get_state
      register: state

    - name: Assert the drivers and packages were cleaned up
      ansible.builtin.assert:
        that:
          - state.result.drivers == []
          - state.result.packages == []
