- name: TYPE=A - add aging record
  ansible.windows.win_dns_record:
    zone: '{{ win_dns_record_zone }}'
    name: testaging
    value: 1.2.3.4
    aging: true
    type: A
    state: present
  register: cmd_result
- name: Type=A - check if record is actually aging
  ansible.windows.win_dns_record_info:
    zone: '{{ win_dns_record_zone }}'
    name: testaging
    type: A
  register: cmd_result_actual
- name: TYPE=A - check aging record results
  ansible.builtin.assert:
    that:
      - cmd_result is changed
      - cmd_result_actual.records | map(attribute="aging") | list == [true]
- name: TYPE=A - check aging record (idempotency)
  ansible.windows.win_dns_record:
    zone: '{{ win_dns_record_zone }}'
    name: testaging
    value: 1.2.3.4
    aging: true
    type: A
    state: present
  register: cmd_result
- name: TYPE=A - check aging record
  ansible.builtin.assert:
    that:
      - cmd_result is not changed
- name: TYPE=A - aging record (change aging)
  ansible.windows.win_dns_record:
    zone: '{{ win_dns_record_zone }}'
    name: testaging
    aging: false
    value: 1.2.3.4
    type: A
    state: present
  register: cmd_result
- name: Type=A - check if record is not aging
  ansible.windows.win_dns_record_info:
    zone: '{{ win_dns_record_zone }}'
    name: testaging
    type: A
  register: cmd_result_actual
- name: TYPE=A - check not aging record results
  ansible.builtin.assert:
    that:
      - cmd_result is changed
      - cmd_result_actual.records | map(attribute="aging") | list == [false]
- name: TYPE=A - remove record
  ansible.windows.win_dns_record:
    zone: '{{ win_dns_record_zone }}'
    name: testaging
    type: A
    state: absent
  register: cmd_result
- name: TYPE=A - remove record get results
  ansible.windows.win_dns_record_info:
    zone: '{{ win_dns_record_zone }}'
    name: testaging
    type: A
  register: cmd_result_actual
- name: TYPE=A - remove record check results
  ansible.builtin.assert:
    that:
      - cmd_result is changed
      - cmd_result_actual.exists == false
      - cmd_result_actual.records | length == 0
- name: 'TYPE=A - add record with allow_update_any: true'
  ansible.windows.win_dns_record:
    zone: '{{ win_dns_record_zone }}'
    name: testallowupdateany
    value: 1.2.3.4
    allow_update_any: true
    type: A
    state: present
  register: cmd_result
- name: 'TYPE=A - check add record with allow_update_any: true results'
  ansible.builtin.assert:
    that:
      - cmd_result is changed
- name: 'TYPE=A - check record with allow_update_any: true (idempotency)'
  ansible.windows.win_dns_record:
    zone: '{{ win_dns_record_zone }}'
    name: testallowupdateany
    value: 1.2.3.4
    allow_update_any: true
    type: A
    state: present
  register: cmd_result
- name: 'TYPE=A - check record with allow_update_any: true (idempotency) results'
  ansible.builtin.assert:
    that:
      - cmd_result is not changed
- name: TYPE=A - remove record with allow_update_any
  ansible.windows.win_dns_record:
    zone: '{{ win_dns_record_zone }}'
    name: testallowupdateany
    type: A
    state: absent
  register: cmd_result
- name: TYPE=A - check remove record with allow_update_any results
  ansible.builtin.assert:
    that:
      - cmd_result is changed
