---
- name: Exercise record diffs using shared lifecycle assertions
  ansible.builtin.include_tasks: tests-diff-record.yml
  loop:
    - name: diff_host
      type: A
      value: 1.2.3.4
      before: ''
      after: 3600 IN A 1.2.3.4
    - name: diff_host
      type: A
      value: 1.2.3.4
      ttl: 7200
      before: 3600 IN A 1.2.3.4
      after: 7200 IN A 1.2.3.4
    - name: diff_host
      type: A
      state: absent
      before: 7200 IN A 1.2.3.4
      after: ''
    - name: diff_srv
      type: SRV
      value: target.example.test.
      port: 443
      priority: 3
      weight: 2
      before: ''
      after: 3600 IN SRV target.example.test. 443 2 3
    - name: diff_srv
      type: SRV
      value: target.example.test.
      port: 8443
      priority: 3
      weight: 2
      before: 3600 IN SRV target.example.test. 443 2 3
      after: 3600 IN SRV target.example.test. 8443 2 3
    - name: diff_srv
      type: SRV
      value: target.example.test.
      port: 8443
      priority: 5
      weight: 2
      before: 3600 IN SRV target.example.test. 8443 2 3
      after: 3600 IN SRV target.example.test. 8443 2 5
    - name: diff_srv
      type: SRV
      value: target.example.test.
      port: 8443
      priority: 5
      weight: 4
      before: 3600 IN SRV target.example.test. 8443 2 5
      after: 3600 IN SRV target.example.test. 8443 4 5
    - name: diff_srv
      type: SRV
      value: target.example.test.
      port: 8443
      priority: 5
      weight: 4
      ttl: 7200
      before: 3600 IN SRV target.example.test. 8443 4 5
      after: 7200 IN SRV target.example.test. 8443 4 5
    - name: diff_srv
      type: SRV
      state: absent
      port: 8443
      priority: 5
      weight: 4
      before: 7200 IN SRV target.example.test. 8443 4 5
      after: ''
  loop_control:
    loop_var: win_dns_record_diff_case
    label: '{{ win_dns_record_diff_case.name }}: {{ win_dns_record_diff_case.after | default("absent", true) }}'
