---
- name: TYPE=PTR - creation (check mode)
  ansible.windows.win_dns_record:
    zone: '{{ win_dns_record_revzone }}'
    name: 7
    value: ansible-mirror.example.com
    type: PTR
  register: cmd_result
  check_mode: true
- name: TYPE=PTR - creation get results (check mode)
  ansible.windows.win_dns_record_info:
    zone: '{{ win_dns_record_revzone }}'
    name: '7'
    type: PTR
  register: cmd_result_actual
- name: TYPE=PTR - creation check results (check mode)
  ansible.builtin.assert:
    that:
      - cmd_result is changed
      - cmd_result_actual.exists == false
      - cmd_result_actual.records | length == 0
- name: TYPE=PTR - creation
  ansible.windows.win_dns_record:
    zone: '{{ win_dns_record_revzone }}'
    name: 7
    value: ansible-mirror.example.com
    type: PTR
  register: cmd_result
- name: TYPE=PTR - creation get results
  ansible.windows.win_dns_record_info:
    zone: '{{ win_dns_record_revzone }}'
    name: '7'
    type: PTR
  register: cmd_result_actual
- name: TYPE=PTR - creation check results
  ansible.builtin.assert:
    that:
      - cmd_result is changed
      - cmd_result_actual.records | map(attribute="record_values") | flatten | sort == ["ansible-mirror.example.com."]
- name: TYPE=PTR - creation (idempotent)
  ansible.windows.win_dns_record:
    zone: '{{ win_dns_record_revzone }}'
