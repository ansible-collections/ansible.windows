---
- name: TYPE=SRV - creation (check mode)
  ansible.windows.win_dns_record:
    zone: '{{ win_dns_record_zone }}'
    name: test1
    value: ansible.example.com
    weight: 5
    priority: 2
    port: 755
    type: SRV
  register: cmd_result
  check_mode: true
- name: TYPE=SRV - creation get results (check mode)
  ansible.windows.win_dns_record_info:
    zone: '{{ win_dns_record_zone }}'
    name: test1
    type: SRV
  register: cmd_result_actual
- name: TYPE=SRV - creation check results (check mode)
  ansible.builtin.assert:
    that:
      - cmd_result is changed
      - cmd_result_actual.exists == false
      - cmd_result_actual.records | length == 0
- name: TYPE=SRV - creation
  ansible.windows.win_dns_record:
    zone: '{{ win_dns_record_zone }}'
    name: test1
    value: ansible.example.com
    weight: 5
    priority: 2
    port: 755
    type: SRV
  register: cmd_result
- name: TYPE=SRV - creation get results
  ansible.windows.win_dns_record_info:
    zone: '{{ win_dns_record_zone }}'
    name: test1
    type: SRV
  register: cmd_result_actual
- name: TYPE=SRV - creation check results
  ansible.builtin.assert:
    that:
      - cmd_result is changed
      - cmd_result_actual.records | map(attribute="record_values") | flatten | sort == ["ansible.example.com."]
- name: TYPE=SRV - creation (idempotent)
  ansible.windows.win_dns_record:
    zone: '{{ win_dns_record_zone }}'
    name: test1
    value: ansible.example.com
    weight: 5
    priority: 2
    port: 755
    type: SRV
  register: cmd_result
- name: TYPE=SRV - creation get results (idempotent)
