  ansible.builtin.assert:
    that:
      - cmd_result is not changed
      - cmd_result_actual.records | map(attribute="record_values") | flatten | sort == ["AAIBY2/AuCccgoJbsaxcQc9TUapptP69lOjxfNuVAA2kjEA="]
